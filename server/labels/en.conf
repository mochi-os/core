[labels]

# Error labels used by respond_error(c, status, code, key, args). The key
# resolves through the user's language preference (or Accept-Language for
# anonymous requests) with the standard fallback chain. The `code` argument
# is the machine-readable identifier returned in the JSON `error` field;
# this catalog provides the human-readable `message` field.

# Authentication / account state
errors.access_denied = Access denied
errors.account_already_set_up = Account already set up
errors.app_required = App required
errors.app_token_mismatch = App token mismatch
errors.app_token_required = App token required
errors.authentication_failed = Authentication failed
errors.authentication_required = Authentication required
errors.restore_in_progress = Your account is still being restored from a backup. Please wait until the restore completes.
errors.bundle_required = A backup file is required.
errors.bundle_invalid = This backup file could not be read.
errors.body_too_large = This upload is too large.
errors.bundle_too_large = This backup file is too large to restore on this server.
errors.bundle_version = This backup was made by an incompatible version of Mochi.
errors.bundle_not_migration = This is a data-only download, not a migration backup. Export a migration backup, with keys included, to move your account.
errors.bundle_tampered = This backup failed its integrity check and may be corrupted or modified.
errors.bundle_schema_newer = Your backup of {app} was made on a newer version than this server supports. Ask the operator to update {app}, then try again.
errors.wrong_passphrase = Incorrect passphrase.
errors.entity_collision = This backup belongs to an account that is still active on this server. Delete that account first, or restore onto a different server.
errors.account_not_fresh = This account already has data and cannot receive a restore. Sign up for a new account and restore into it instead.
errors.restore_failed = The restore could not be completed.
