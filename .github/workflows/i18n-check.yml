name: i18n Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check hardcoded English in user-facing server responses
        # A mirror of claude/scripts/check-i18n-server.py in the monorepo; a
        # parity test there fails when the two differ. Allowlist with a
        # trailing `// i18n-ok: <reason>` on the line holding the value.
        run: python3 .github/scripts/check-i18n-server.py server

      - name: Check server label completeness
        run: python3 .github/scripts/check-labels.py
