# nl-be overlay. Regional catalogues carry only what differs from the
# parent: language_fallbacks resolves nl-be -> nl -> en key by key, and a
# present key beats an inherited one, so a copy of the parent's string
# overrides nothing today and pins this locale to it once the parent changes.
# 166 such copies were removed; what remains genuinely differs.

