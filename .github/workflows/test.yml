name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: make

      - name: Test (fast)
        run: make test

  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Unused code (staticcheck U1000)
        # Catches code left behind when a subsystem is removed. The replication
        # removal was thorough everywhere anyone looked and still left eleven
        # dead functions plus a memoisation whose setter ran on every manager
        # pass with nothing reading it - found a month later, by accident.
        #
        # Only U1000: the other checks are opinions this codebase has not
        # adopted, and a gate that reports things nobody intends to act on gets
        # ignored. Tests are analysed too, deliberately - a function reachable
        # only from a test is used, and excluding them would flag the helpers
        # that exercise the code under test.
        #
        # Something deliberately kept without a caller carries
        # //lint:ignore U1000 <reason> above it, so the exception is a sentence
        # a reviewer can disagree with rather than a silent allowance.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" -checks=U1000 ./server/

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Test (race detector)
        # Race detector catches concurrent-write bugs in shared state.
        # Slower (~8x) and requires cgo, so run as a separate job.
        run: make test-race
