name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: make

      - name: Test (fast)
        run: make test

  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Unused code (staticcheck U1000)
        # Only U1000: the other checks are opinions this codebase has not
        # adopted. Tests are analysed deliberately - a function reachable only
        # from a test is used. Keep something without a caller by annotating it
        # //lint:ignore U1000 <reason>.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" -checks=U1000 ./server/

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Test (race detector)
        # Race detector catches concurrent-write bugs in shared state.
        # Slower (~8x) and requires cgo, so run as a separate job.
        run: make test-race
