# United States English. Regional overlays carry only what differs from the
# parent catalogue: language_fallbacks resolves en-us -> en, and a present key
# beats an inherited one, so a copy of an en string silently pins en-US to it
# when en later changes. Every entry this file used to hold was such a copy.

[labels]

# US-English overlay. Core's en.conf is neutral English, so only keys that
# genuinely differ belong here; the en-us -> en fallback serves the rest. The
# file's existence is what puts en-us in the language picker.

